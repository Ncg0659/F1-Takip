<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>F1 TAKİP — Kaynak kontrolü</title>
<style>
  :root { --zemin:#0f1722; --kart:#16212f; --cizgi:#26354a; --yazi:#e8edf3; --soluk:#8fa0b5; --ok:#2e9d57; --uyari:#d9a400; --hata:#d4161c; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 16px; background: var(--zemin); color: var(--yazi); max-width: 980px; margin-inline: auto; }
  h1 { margin: 0 0 4px; font-size: 1.35rem; letter-spacing: .02em; }
  p { color: var(--soluk); margin: 0 0 12px; line-height: 1.45; font-size: .92rem; }
  .ust { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
  button { padding: 10px 14px; font: inherit; font-weight: 600; border: 1px solid var(--cizgi); background: var(--kart); color: var(--yazi); border-radius: 8px; cursor: pointer; min-height: 44px; }
  button.ana { background: var(--hata); border-color: var(--hata); color: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  .liste { display: grid; gap: 10px; }
  .kutu { background: var(--kart); border: 1px solid var(--cizgi); border-left: 5px solid var(--cizgi); border-radius: 8px; padding: 12px 14px; }
  .kutu[data-d="OK"] { border-left-color: var(--ok); } .kutu[data-d="UYARI"] { border-left-color: var(--uyari); } .kutu[data-d="HATA"] { border-left-color: var(--hata); }
  .baslik { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .baslik b { font-size: 1rem; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: .75rem; font-weight: 700; color: #fff; background: #5b6b80; letter-spacing: .04em; }
  .chip[data-d="OK"] { background: var(--ok); } .chip[data-d="UYARI"] { background: var(--uyari); color: #1b1300; } .chip[data-d="HATA"] { background: var(--hata); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 8px 0 0; font-size: .88rem; }
  dt { color: var(--soluk); } dd { margin: 0; overflow-wrap: anywhere; }
  .not { color: var(--soluk); font-size: .82rem; margin-top: 6px; }
  #rapor { background: #0a1018; border: 1px solid var(--cizgi); border-radius: 8px; padding: 12px; white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: .8rem; margin-top: 16px; color: var(--yazi); }
  a { color: #8fc1ff; }
</style>
</head>
<body>
  <h1>Kaynak kontrolü <small style="color:var(--soluk);font-weight:400">v2 · 3.2.0</small></h1>
  <p>Her kaynak bu cihazın tarayıcısından <b>bir kez</b> denenir (düğmeye basınca). Sürekli istek yok; Jolpica istekleri arasında bekleme var.
     Erişim durumu, son veri tarihi, hata türü ve yanıt süresi gösterilir. Bittiğinde "Raporu kopyala" ile sonucu gönderebilirsin.</p>
  <div class="ust">
    <button class="ana" id="calistir" type="button">Kontrolü başlat</button>
    <button id="kopyala" type="button" disabled>Raporu kopyala</button>
  </div>
  <div class="liste" id="liste"></div>
  <div id="rapor" hidden></div>

<script src="notlar-kaynaklar.js"></script>
<script src="notlar-motor.js"></script>
<script src="diger-seriler.js"></script>
<script>
(function () {
  "use strict";
  var ZAMAN_ASIMI = 10000, sonuclar = [];
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]; }); }
  function bekle(ms) { return new Promise(function (c) { setTimeout(c, ms); }); }
  function trTarih(t) { if (!t) { return "—"; } var d = new Date(t); if (isNaN(d)) { return String(t); } return d.toLocaleString("tr-TR", { timeZone: "Europe/Istanbul", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) + " TR"; }
  function once(t) { if (!t) { return ""; } var dk = Math.round((Date.now() - new Date(t).getTime()) / 60000); if (isNaN(dk)) { return ""; } if (dk < 60) { return " (" + dk + " dk önce)"; } if (dk < 2880) { return " (" + Math.round(dk / 60) + " sa önce)"; } return " (" + Math.round(dk / 1440) + " gün önce)"; }

  // Tek istek: { ok, status, veri, ms, tur } — tur: "429" | "http" | "zaman-asimi" | "ag-cors" | "json"
  async function iste(url) {
    var t0 = performance.now(), ac = new AbortController(), z = setTimeout(function () { ac.abort(); }, ZAMAN_ASIMI);
    try {
      var r = await fetch(url, { signal: ac.signal, cache: "no-store" });
      var ms = Math.round(performance.now() - t0);
      if (r.status === 429) { return { ok: false, status: 429, ms: ms, tur: "429", retry: r.headers.get("Retry-After") }; }
      if (!r.ok) { return { ok: false, status: r.status, ms: ms, tur: "http" }; }
      try { return { ok: true, status: r.status, ms: ms, veri: await r.json() }; } catch (e) { return { ok: false, status: r.status, ms: ms, tur: "json" }; }
    } catch (e) {
      var ms2 = Math.round(performance.now() - t0);
      return { ok: false, status: 0, ms: ms2, tur: e && e.name === "AbortError" ? "zaman-asimi" : "ag-cors" };
    } finally { clearTimeout(z); }
  }
  var TUR_TR = { "429": "HTTP 429 — istek sınırı aşıldı", "http": "HTTP hatası", "zaman-asimi": "Zaman aşımı (" + ZAMAN_ASIMI / 1000 + " sn)", "ag-cors": "Ağ / CORS hatası (sunucu yanıt vermedi ya da tarayıcı engelledi)", "json": "Yanıt okunamadı (JSON değil)" };
  function hataMetni(r) { return r.tur === "http" ? "HTTP " + r.status : (TUR_TR[r.tur] || r.tur) + (r.retry ? " · Retry-After: " + r.retry : ""); }

  function kutu(s) {
    var satir = s.alanlar.map(function (a) { return "<dt>" + esc(a[0]) + "</dt><dd>" + a[1] + "</dd>"; }).join("");
    return "<section class='kutu' data-d='" + s.d + "'><div class='baslik'><b>" + esc(s.ad) + "</b><span class='chip' data-d='" + s.d + "'>" + esc(s.etiket) + "</span></div>" +
      "<dl>" + satir + "</dl>" + (s.not ? "<div class='not'>" + s.not + "</div>" : "") + "</section>";
  }
  function ciz() { document.getElementById("liste").innerHTML = sonuclar.map(kutu).join(""); }
  function ekle(s) { sonuclar.push(s); ciz(); }

  // ---------- Jolpica ----------
  async function jolpica() {
    var yil = new Date().getFullYear();
    var a = await iste("https://api.jolpi.ca/ergast/f1/" + yil + "/races/?limit=100");
    await bekle(600);                                           // resmî sınır 4 istek/sn: ikinci isteği bekleterek at
    var b = a.ok ? await iste("https://api.jolpi.ca/ergast/f1/current/last/results/?limit=1") : null;
    if (!a.ok) { return { ad: "Jolpica (takvim, sonuç, puan)", d: "HATA", etiket: a.tur === "429" ? "İSTEK SINIRI" : "ERİŞİLEMİYOR", alanlar: [["Hata türü", esc(hataMetni(a))], ["Yanıt süresi", a.ms + " ms"]],
      not: "Uygulama bu durumda kendi kuyruğuyla bekleyip otomatik yeniden dener. Resmî sınır: saniyede 4, saatte 500 istek." }; }
    var yr = (((a.veri || {}).MRData || {}).RaceTable || {}).Races || [];
    var son = b && b.ok ? ((((b.veri || {}).MRData || {}).RaceTable || {}).Races || [])[0] : null;
    var al = [["Erişim", "Doğrudan (tarayıcıdan)"], ["Takvim", yr.length + " yarış (" + yil + ")"], ["Yanıt süresi", a.ms + " ms" + (b ? " · " + b.ms + " ms" : "")]];
    if (son) { al.push(["Son sonuç verisi", esc(son.raceName) + " · " + esc(son.date) + once(son.date + "T" + (son.time || "12:00:00Z"))]); }
    else if (b) { al.push(["Son sonuç verisi", b.ok ? "Yok (boş yanıt)" : esc(hataMetni(b))]); }
    return { ad: "Jolpica (takvim, sonuç, puan)", d: yr.length ? (b && !b.ok ? "UYARI" : "OK") : "UYARI", etiket: yr.length ? "ÇALIŞIYOR" : "BOŞ VERİ", alanlar: al };
  }

  // ---------- OpenF1 ----------
  async function openf1() {
    var yil = new Date().getFullYear(), a = await iste("https://api.openf1.org/v1/sessions?year=" + yil);
    if (!a.ok) { return { ad: "OpenF1 (antrenman / sprint sıralaması sonuçları)", d: "HATA", etiket: "ERİŞİLEMİYOR", alanlar: [["Hata türü", esc(hataMetni(a))], ["Yanıt süresi", a.ms + " ms"]] }; }
    var simdi = Date.now(), ss = (Array.isArray(a.veri) ? a.veri : []).filter(function (s) { return Date.parse(s.date_end) < simdi; }).sort(function (x, y) { return Date.parse(y.date_end) - Date.parse(x.date_end); });
    var s = ss[0], al = [["Erişim", "Doğrudan (tarayıcıdan)"], ["Yanıt süresi", a.ms + " ms"]], d = "OK", et = "ÇALIŞIYOR", not = "";
    if (!s) { return { ad: "OpenF1 (antrenman / sprint sıralaması sonuçları)", d: "UYARI", etiket: "SEANS YOK", alanlar: al }; }
    var b = await iste("https://api.openf1.org/v1/session_result?session_key=" + s.session_key);
    al.push(["Son biten seans", esc(s.country_name || s.location || "") + " · " + esc(s.session_name) + " · bitiş " + trTarih(s.date_end) + once(s.date_end)]);
    if (b.ok && Array.isArray(b.veri) && b.veri.length) { al.push(["Sonuç", b.veri.length + " satır yayımlanmış (" + b.ms + " ms)"]); }
    else if (b.ok) { d = "UYARI"; et = "SONUÇ BEKLENİYOR"; al.push(["Sonuç", "Henüz yayımlanmamış (boş)"]); }
    else { d = "UYARI"; et = "SONUÇ OKUNAMADI"; al.push(["Sonuç", esc(hataMetni(b))]); }
    not = "Ücretsiz OpenF1 seans SIRASINDA canlı veri vermez (canlı veri ücretli pakette). Sonuçlar seans bittikten sonra gelir; uygulama bunu otomatik kontrol eder.";
    return { ad: "OpenF1 (antrenman / sprint sıralaması sonuçları)", d: d, etiket: et, alanlar: al, not: not };
  }

  // ---------- Bluesky muhabirleri ----------
  async function bluesky(k) {
    var a = await iste("https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=" + encodeURIComponent(k.did || k.handle) + "&limit=30");
    var ad = "Race Feed · " + k.name + (k.enabled && k.liveSource ? "" : " (devre dışı)");
    if (!a.ok) { return { ad: ad, d: "HATA", etiket: "ERİŞİLEMİYOR", alanlar: [["Hata türü", esc(hataMetni(a))], ["Yanıt süresi", a.ms + " ms"]], not: "Diğer muhabir kaynağı bundan etkilenmez." }; }
    var feed = ((a.veri || {}).feed || []).filter(function (o) { return o.post && !o.reason; });
    var zam = feed.map(function (o) { return (o.post.record || {}).createdAt || o.post.indexedAt; }).filter(Boolean).sort().reverse();
    var gun = zam.filter(function (t) { return Date.now() - Date.parse(t) < 86400000; }).length;
    var seri = window.RaceFeed && RaceFeed.digerSeriMi ? feed.filter(function (o) { return RaceFeed.digerSeriMi((o.post.record || {}).text); }).length : null;
    var sonYas = zam[0] ? Date.now() - Date.parse(zam[0]) : Infinity;
    var d = sonYas < 7 * 86400000 ? "OK" : "UYARI", et = d === "OK" ? "AKTİF" : "UZUN SÜREDİR PAYLAŞIM YOK";
    var al = [["Hesap", "<a href='https://bsky.app/profile/" + esc(k.handle) + "' target='_blank' rel='noopener'>@" + esc(k.handle) + "</a>" + (k.did ? " · <code>" + esc(k.did) + "</code>" : "")],
              ["Son paylaşım", trTarih(zam[0]) + once(zam[0])], ["Son 24 saat", gun + " paylaşım"], ["Yanıt süresi", a.ms + " ms"]];
    if (seri != null) { al.push(["Başka seri notu", seri + " / " + feed.length + " (F1 akışına alınmaz: F2, F3, Formula E…)"]); }
    if (!(k.enabled && k.liveSource)) { d = "UYARI"; et = "DEVRE DIŞI"; }
    return { ad: ad, d: d, etiket: et, alanlar: al };
  }

  // ---------- F2 / F3 (elle güncellenen veri) ----------
  function digerSeriler() {
    return (window.DIGER_SERILER || []).filter(function (s) { return s.kod === "f2" || s.kod === "f3"; }).map(function (s) {
      return { ad: s.ad + " (uygulama verisi)", d: "UYARI", etiket: "ELLE GÜNCELLENİR",
        alanlar: [["Son güncelleme", esc(s.guncelleme || "—")], ["Kaynak", esc(s.kaynak || "—")], ["Durum", esc(s.durum || "—")]],
        not: "Ücretsiz, tarayıcıdan okunabilen resmî bir F2/F3 veri servisi yok (resmî siteler CORS ile okunamaz). Kontrol: <a href='https://www.fiaformula" + (s.kod === "f2" ? "2" : "3") + ".com/Standings/Driver' target='_blank' rel='noopener'>resmî puan tablosu</a>." };
    });
  }

  function metinYap(h) { var d = document.createElement("div"); d.innerHTML = h; return d.textContent; }   // rapor: etiket ve HTML kodları (&#39;) olmadan düz metin
  async function calistir() {
    var b = document.getElementById("calistir"); b.disabled = true; b.textContent = "Kontrol ediliyor…";
    document.getElementById("kopyala").disabled = true; sonuclar = []; ciz();
    ekle(await jolpica());
    ekle(await openf1());
    var ks = (window.NOTLAR_KAYNAKLAR || []).filter(function (k) { return k.type === "bluesky"; });
    var cv = await Promise.all(ks.map(bluesky));                 // muhabirler paralel ve bağımsız
    cv.forEach(ekle);
    digerSeriler().forEach(ekle);
    var r = "F1 TAKİP kaynak kontrolü · " + new Date().toLocaleString("tr-TR", { timeZone: "Europe/Istanbul" }) + " TR\n" + navigator.userAgent + "\n\n" +
      sonuclar.map(function (s) { return "■ " + s.ad + " — " + s.etiket + "\n" + s.alanlar.map(function (a) { return "  " + a[0] + ": " + metinYap(a[1]); }).join("\n"); }).join("\n\n");
    var el = document.getElementById("rapor"); el.textContent = r; el.hidden = false;
    b.disabled = false; b.textContent = "Kontrolü yeniden başlat"; document.getElementById("kopyala").disabled = false;
  }
  document.getElementById("calistir").addEventListener("click", calistir);
  document.getElementById("kopyala").addEventListener("click", function () {
    var t = document.getElementById("rapor").textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { this.textContent = "Kopyalandı"; }.bind(this), function () { alert(t); });
  });
})();
</script>
</body>
</html>
